<style>
:root{
  --navy-950:#4a3c2a;
  --navy-900:#5c4a34;
  --navy-800:#6b5940;
  --navy-700:#8a7355;
  --blue-600:#a6835a;
  --blue-500:#c2a878;
  --blue-100:#f5ecdf;
  --bg:#f6f3ee;
  --card:#ffffff;
  --border:#e6e9f2;
  --text:#16213e;
  --text-dim:#6b7488;
  --text-faint:#9aa2b6;
  --green:#16a34a;
  --green-bg:#dcfce7;
  --amber:#d97706;
  --amber-bg:#fef3c7;
  --red:#dc2626;
  --red-bg:#fee2e2;
  --teal:#0d9488;
  --teal-bg:#ccfbf1;
  --purple:#7c3aed;
  --purple-bg:#ede9fe;
  --radius:12px;
  --shadow:0 1px 2px rgba(15,24,48,.04), 0 8px 24px -12px rgba(15,24,48,.10);

  /* Identité Vectorys — utilisées uniquement pour l'écran de connexion (#login-screen) */
  --vx-navy:#a6835a;
  --vx-navy-dark:#8a6d4f;
  --vx-navy-light:#c2a878;
  --vx-green:#74bc1f;
  --vx-green-dark:#5c9518;
  --vx-gray:#88898d;
  --vx-gray-light:#f3f4f5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--blue-100);}
a{color:inherit;text-decoration:none;}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg,#ffffff 0%,#f3efe8 100%);
  padding:24px;
}
.login-card{
  width:100%;
  max-width:920px;
  display:grid;
  grid-template-columns:1fr 1fr;
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 60px -20px rgba(15,24,48,.25);
}
.login-visual{
  background:linear-gradient(160deg,var(--vx-navy-light),var(--vx-navy-dark) 70%);
  color:#fff;
  padding:48px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:22px;
  position:relative;
  overflow:hidden;
}
.login-visual::before{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 30% 20%, rgba(116,188,31,.30), transparent 45%),
    radial-gradient(circle at 80% 90%, rgba(116,188,31,.18), transparent 45%);
}
.login-visual .logo-badge{
  position:relative;z-index:1;
  background:transparent;
  border-radius:16px;
  padding:20px 26px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:vxLogoFadeIn .7s ease-out both;
}
.login-visual .logo-badge img{
  display:block;
  width:200px;
  height:auto;
  max-width:260px;
  object-fit:contain;
  background:transparent;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));
}
@keyframes vxLogoFadeIn{
  from{opacity:0;transform:translateY(-8px);}
  to{opacity:1;transform:translateY(0);}
}
.login-visual .brand{
  position:relative;z-index:1;
  font-weight:800;
  font-size:15px;
  letter-spacing:2.5px;
  color:#fff;
  text-transform:uppercase;
}
.login-visual .tagline{
  position:relative;z-index:1;
  color:#c7d0e8;
  font-size:13px;
  text-align:center;
  max-width:220px;
  line-height:1.5;
}
.login-form{
  padding:52px 44px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.login-form .form-logo{
  height:25px;
  width:auto;
  max-width:180px;
  object-fit:contain;
  background:transparent;
  display:block;
  align-self:center;
  margin:0 0 18px;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.12));
  animation:vxLogoFadeIn .7s ease-out both;
}
.login-form h1{font-size:26px;margin:0 0 4px;font-weight:800;}
.login-form .sub{color:var(--text-dim);font-size:14px;margin:0 0 28px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field .input-wrap{position:relative;}
.field input,.field select{
  width:100%;
  padding:11px 14px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-size:14px;
  outline:none;
  transition:border-color .15s;
  background:#fbfcfe;
}
.field input:focus,.field select:focus{border-color:var(--blue-500);background:#fff;}
#login-screen .field input:focus,#login-screen .field select:focus{border-color:var(--vx-green);background:#fff;}
.field .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:16px;background:none;border:none;padding:4px;}
.row-between{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin:6px 0 22px;color:var(--text-dim);}
.row-between label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.btn-primary{
  width:100%;
  background:var(--vx-navy);
  color:#fff;
  border:none;
  padding:12px 16px;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  letter-spacing:.2px;
  transition:background .15s, transform .1s;
}
.btn-primary:hover{background:var(--vx-navy-dark);}
.btn-primary:active{transform:scale(.99);}
.role-picker{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;}
.role-chip{
  flex:1;
  min-width:120px;
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:9px 10px;
  font-size:12px;
  font-weight:600;
  color:var(--text-dim);
  background:#fbfcfe;
  text-align:center;
  transition:all .15s;
}
.role-chip.active{border-color:var(--vx-green);background:#eef7e2;color:var(--vx-green-dark);}
#login-screen .row-between a{color:var(--vx-navy);font-weight:700;}
#login-screen input[type="checkbox"]{accent-color:var(--vx-green);}

/* ---------- APP SHELL ---------- */
#app{display:none;min-height:100vh;grid-template-columns:236px 1fr;}
#app.visible{display:grid;}
.sidebar{
  background:var(--navy-950);
  color:#c7cee3;
  display:flex;
  flex-direction:column;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
.sidebar .role-badge{
  margin:18px 16px 6px;
  font-size:10.5px;
  font-weight:800;
  letter-spacing:.8px;
  color:#7d89ab;
  padding:6px 10px;
  border:1px solid #26335a;
  border-radius:7px;
  text-align:center;
}
.sidebar nav{padding:8px 10px;flex:1;}
.side-link{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  border-radius:9px;
  font-size:13.5px;
  font-weight:500;
  color:#aab4d1;
  margin-bottom:2px;
  transition:background .15s,color .15s;
  cursor:pointer;
  white-space:nowrap;
}
.side-link:hover{background:#1a2748;color:#fff;}
.side-link.active{background:var(--blue-600);color:#fff;}
.side-link .ic{width:16px;text-align:center;font-size:14px;flex-shrink:0;}
.sidebar .logout{margin:8px 10px 16px;padding:0 10px;}

.main{display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:60px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;top:0;z-index:5;
}
.topbar .left{display:flex;align-items:center;gap:14px;}
.topbar h2{font-size:16px;font-weight:700;margin:0;}
.topbar .right{display:flex;align-items:center;gap:16px;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:#fff;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:14px;position:relative;
}
.icon-btn .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
.admin-chip{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}

.topbar-menu{position:relative;}
.search-panel,.notif-panel{
  position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--border);border-radius:12px;
  box-shadow:0 12px 30px rgba(20,30,60,.16);z-index:30;display:none;
}
.search-panel.show,.notif-panel.show{display:block;}
.search-panel{width:340px;padding:12px;}
.search-panel input{
  width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;background:#fbfcfe;box-sizing:border-box;
}
.search-panel input:focus{outline:none;border-color:var(--blue-500);background:#fff;}
.search-results{max-height:360px;overflow-y:auto;margin-top:8px;}
.search-group{margin-bottom:6px;}
.search-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-faint);font-weight:700;padding:6px 8px 4px;}
.search-item{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.search-item:hover{background:#f5f7fb;}
.search-item .ttl{font-size:13px;font-weight:600;color:var(--text);}
.search-item .sub{font-size:11.5px;color:var(--text-dim);}
.search-empty{padding:26px 10px;text-align:center;color:var(--text-faint);font-size:12.5px;}

.notif-panel{width:320px;}
.notif-head{padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;}
.notif-list{max-height:360px;overflow-y:auto;}
.notif-item{padding:11px 14px;border-bottom:1px solid #f0f2f8;cursor:pointer;display:flex;gap:10px;align-items:flex-start;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:#fafbfe;}
.notif-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.notif-ic.red{background:var(--red-bg);color:var(--red);}
.notif-ic.amber{background:var(--amber-bg);color:var(--amber);}
.notif-ic.green{background:var(--green-bg);color:var(--green);}
.notif-ic.blue{background:var(--blue-100);color:var(--blue-600);}
.notif-txt .t{font-size:13px;font-weight:600;color:var(--text);}
.notif-txt .d{font-size:11.5px;color:var(--text-dim);margin-top:1px;}
.notif-empty{padding:30px 14px;text-align:center;color:var(--text-faint);font-size:12.5px;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-100);color:var(--blue-600);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}

.content{padding:24px 28px 60px;flex:1;}
.page-title{font-size:20px;font-weight:800;margin:0 0 20px;}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
.kpi{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.kpi .lbl{font-size:12px;color:var(--text-dim);font-weight:600;margin-bottom:3px;}
.kpi .val{font-size:22px;font-weight:800;}
.kpi.blue .ic{background:var(--blue-100);color:var(--blue-600);}
.kpi.green .ic{background:var(--green-bg);color:var(--green);}
.kpi.amber .ic{background:var(--amber-bg);color:var(--amber);}
.kpi.purple .ic{background:var(--purple-bg);color:var(--purple);}
.kpi.red .ic{background:var(--red-bg);color:var(--red);}

.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.card-head h3{margin:0;font-size:14.5px;font-weight:700;}
.card-body{padding:16px 18px;}
.link-sm{font-size:12.5px;color:var(--blue-600);font-weight:600;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text-faint);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);
}
tbody td{padding:12px;border-bottom:1px solid #f0f2f8;color:var(--text);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfe;}
.mono{font-family:'Roboto Mono',monospace;font-size:12px;color:var(--text-dim);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.teal{background:var(--teal-bg);color:var(--teal);}
.badge.grey{background:#eef0f6;color:var(--text-dim);}
.move-in{color:var(--green);font-weight:700;}
.move-out{color:var(--red);font-weight:700;}

.act-icons{display:flex;gap:6px;}
.act-icons button{
  width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;
  color:var(--text-dim);font-size:12px;display:flex;align-items:center;justify-content:center;
}
.act-icons button:hover{background:#f5f7fb;}
.act-icons button.danger:hover{color:var(--red);border-color:#fbc6c6;background:var(--red-bg);}
.act-icons button.view:hover{color:var(--blue-600);border-color:#bcd3fb;background:var(--blue-100);}

.btn{
  padding:9px 16px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid transparent;
  display:inline-flex;align-items:center;gap:7px;
}
.btn-blue{background:var(--blue-600);color:#fff;}
.btn-blue:hover{background:#2559c9;}
.btn-ghost{background:#fff;border-color:var(--border);color:var(--text);}
.btn-ghost:hover{background:#f5f7fb;}

.search-box{position:relative;}
.search-box input{
  padding:9px 12px 9px 34px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;width:230px;background:#fbfcfe;
}
.search-box input:focus{outline:none;border-color:var(--blue-500);background:#fff;}
.search-box .sic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--blue-600);border-color:var(--blue-600);}
.tab .count{margin-left:6px;font-size:11px;background:#eef0f6;color:var(--text-dim);padding:1px 6px;border-radius:10px;}
.tab.active .count{background:var(--blue-100);color:var(--blue-600);}

.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 4px 4px;}
.donut{width:150px;height:150px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;}
.legend{width:100%;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.legend .item{display:flex;align-items:center;justify-content:space-between;}
.legend .item .k{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
.legend .dot{width:9px;height:9px;border-radius:50%;}

.stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.pill{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:12.5px;color:var(--text-dim);font-weight:600;}
.pill b{color:var(--text);font-size:14px;margin-right:5px;}

.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px;}
.form-grid .field{margin-bottom:0;}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 2px;font-size:12.5px;color:var(--text-dim);}
.pagenums{display:flex;gap:4px;}
.pagenums span,.pagenums button{
  width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;border:1px solid transparent;background:none;color:var(--text-dim);
}
.pagenums .cur{background:var(--blue-600);color:#fff;font-weight:700;}

.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}
.detail-box{background:#fbfcfe;border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.detail-box .lbl{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
.detail-box .val{font-size:14.5px;font-weight:700;}

.toast{
  position:fixed;bottom:24px;right:24px;background:var(--navy-950);color:#fff;padding:13px 20px;border-radius:10px;
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;transition:all .25s;z-index:999;
}
.toast.show{transform:translateY(0);opacity:1;}

/* ---- notif-toast : petit rectangle qui apparaît quand une notification arrive ---- */
.notif-toast-wrap{
  position:fixed;top:74px;right:24px;z-index:997;
  display:flex;flex-direction:column;gap:10px;width:320px;max-width:calc(100vw - 32px);
  pointer-events:none;
}
.notif-toast{
  position:relative;overflow:hidden;pointer-events:auto;cursor:pointer;
  background:#fff;border:1px solid var(--border);border-radius:12px;
  box-shadow:0 14px 34px -8px rgba(20,30,60,.24);
  padding:12px 28px 12px 14px;display:flex;gap:10px;align-items:flex-start;
  transform:translateX(24px);opacity:0;transition:transform .28s ease,opacity .28s ease;
}
.notif-toast.show{transform:translateX(0);opacity:1;}
.notif-toast.hide{transform:translateX(24px);opacity:0;}
.notif-toast:hover{box-shadow:0 18px 40px -6px rgba(20,30,60,.3);}
.notif-toast .ntxt{min-width:0;}
.notif-toast .ntxt .t{font-size:13px;font-weight:700;color:var(--text);}
.notif-toast .ntxt .d{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.notif-toast .nclose{
  position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:11px;
}
.notif-toast .nclose:hover{background:#f0f2f8;color:var(--text-dim);}
.notif-toast .nprog{position:absolute;left:0;bottom:0;height:2px;background:var(--blue-500);width:100%;}

.crumb{font-size:12.5px;color:var(--text-faint);margin-bottom:6px;}
.crumb a{color:var(--blue-600);font-weight:600;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(15,24,48,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  box-shadow:0 30px 60px -20px rgba(15,24,48,.35);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:15px;font-weight:800;}
.modal-close{width:28px;height:28px;border-radius:8px;border:none;background:#f5f7fb;color:var(--text-dim);font-size:14px;}
.modal-body{padding:18px 20px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}
.modal-body .field{margin-bottom:14px;}
.detail-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f8;font-size:13px;}
.detail-line:last-child{border-bottom:none;}
.detail-line .k{color:var(--text-dim);}
.detail-line .v{font-weight:700;}

@media(max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr 1fr;}
  .detail-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>

// L'authentification et les comptes utilisateurs sont désormais gérés par la base
// de données MySQL via l'API PHP (dossier /api). Voir api/login.php, api/users_*.php.
const API = 'api/';
async function apiCall(endpoint, body){
  const res = await fetch(API + endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    credentials: 'same-origin',
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}
async function apiGet(endpoint){
  const res = await fetch(API + endpoint, {credentials:'same-origin'});
  return res.json();
}

async function loadArticles(){
  try{
    const data = await apiGet('articles_list.php');
    if(data.success){ articles = data.articles; }
    else { toast(data.message || 'Erreur lors du chargement des articles'); }
  }catch(e){ toast('Impossible de contacter le serveur (vérifiez XAMPP)'); }
}
async function loadFournisseurs(){
  try{
    const data = await apiGet('fournisseurs_list.php');
    if(data.success){ fournisseurs = data.fournisseurs; }
    else { toast(data.message || 'Erreur lors du chargement des fournisseurs'); }
  }catch(e){ toast('Impossible de contacter le serveur (vérifiez XAMPP)'); }
}

/* Construit la liste des notifications courantes (sans toucher au DOM).
   Chaque item a une "key" stable qui sert à détecter les notifications
   nouvelles (pour déclencher le petit rectangle / toast). */
async function computeNotifItems(){
  await Promise.all([loadArticles(), loadDemandes()]);
  const items = [];
  if(state.role==='achats'){
    articles.filter(a=>a.stock<=0).forEach(a=>items.push({
      key:`rupture-${a.id}`, ic:'📉', cls:'red', title:`${a.nom} — rupture de stock`,
      sub:`Stock actuel : 0 · Emplacement ${a.emp || '—'}`,
      action:()=>{ state.route='alerts'; render(); }
    }));
    articles.filter(a=>a.stock>0 && a.stock<=a.min).forEach(a=>items.push({
      key:`bas-${a.id}`, ic:'⚠', cls:'amber', title:`${a.nom} — stock bas`,
      sub:`Stock actuel : ${a.stock} (min ${a.min}) · Emplacement ${a.emp || '—'}`,
      action:()=>{ state.route='alerts'; render(); }
    }));
  }
  if(state.role!=='service'){
    // Une demande reste "attente" quand le stock disponible ne suffit pas à la couvrir
    // entièrement et/ou qu'elle contient un article hors de l'accès du compte demandeur
    // (sinon elle est auto-validée, cf demandes_add.php) : une validation manuelle du
    // responsable achats est alors nécessaire dès que le stock est réapprovisionné.
    const attente = demandes.filter(d=>d.statut==='attente');
    if(attente.length){
      if(state.role==='achats'){
        items.push({
          key:`attente-${attente.map(d=>d.num).sort().join('_')}`,
          ic:'⚠', cls:'amber',
          title:`${attente.length} demande${attente.length>1?'s':''} en attente de décision`,
          sub: attente.slice(0,3).map(d=>d.num).join(', '),
          action:()=>{ state.route='demandes'; state.demandeTab='attente'; render(); }
        });
      } else {
        items.push({
          key:`attente-${attente.map(d=>d.num).sort().join('_')}`,
          ic:'📄', cls:'blue', title:`${attente.length} demande${attente.length>1?'s':''} en attente de validation`,
          sub: attente.slice(0,3).map(d=>d.num).join(', '),
          action:()=>{ state.route='demandes'; state.demandeTab='attente'; render(); }
        });
      }
    }
  } else {
    demandes.filter(d=>d.demandeur===state.userName && +d.notif_lue===0 && d.statut==='validee')
      .forEach(d=>items.push({
        key:`validee-${d.num}`,
        ic: '✅',
        cls: 'green',
        title: `Votre demande ${d.num} a été validée`,
        sub: `${d.service} · ${d.date}`,
        action:()=>{ state.route='my-demandes'; render(); ackDemandeNotif(d.num); }
      }));
  }
  return items;
}

// Le point rouge ne reflète pas juste "il y a des notifications" mais "il y a des
// notifications que l'utilisateur n'a pas encore vues" (pas encore ouvert le panneau
// depuis leur apparition). Dès qu'il ouvre le panneau, elles passent dans notifDotSeen
// et le point disparaît ; il ne revient que si une notification vraiment nouvelle arrive.
function updateNotifDot(items){
  const dot = document.getElementById('notif-dot');
  if(!dot) return;
  const hasUnseen = items.some(it=>!notifDotSeen.has(it.key));
  dot.style.display = hasUnseen ? 'block' : 'none';
}

async function refreshNotifications(){
  const items = await computeNotifItems();

  // Toute notification dont la "key" n'était pas encore connue est nouvelle :
  // on la fait apparaître dans le petit rectangle (notif-toast), quelques secondes,
  // cliquable pour aller directement à l'endroit concerné (ex : Alertes de stock).
  items.forEach(it=>{ if(!seenNotifKeys.has(it.key)) showNotifToast(it); });
  seenNotifKeys = new Set(items.map(it=>it.key));

  updateNotifDot(items);

  const list = document.getElementById('notif-list');
  const head = document.getElementById('notif-head');
  if(!list || !head) return items;

  head.textContent = items.length ? `Notifications (${items.length})` : 'Notifications';

  if(!items.length){ list.innerHTML = '<div class="notif-empty">Aucune notification</div>'; return items; }

  window.__notifActions = [];
  list.innerHTML = items.map(it=>{
    const idx = window.__notifActions.push(it.action)-1;
    return `<div class="notif-item" onclick="runNotifAction(${idx})">
      <div class="notif-ic ${it.cls}">${it.ic}</div>
      <div class="notif-txt"><div class="t">${escapeHtml(it.title)}</div><div class="d">${escapeHtml(it.sub)}</div></div>
    </div>`;
  }).join('');
  return items;
}
function runNotifAction(idx){
  const fn = window.__notifActions && window.__notifActions[idx];
  closeTopbarPanels();
  if(fn) fn();
}

/* ---- notif-toast : le petit rectangle qui apparaît quelques secondes ---- */
function startNotifPolling(){
  stopNotifPolling();
  notifPollTimer = setInterval(refreshNotifications, NOTIF_POLL_INTERVAL);
}
function stopNotifPolling(){
  if(notifPollTimer){ clearInterval(notifPollTimer); notifPollTimer = null; }
}

function showNotifToast(item){
  const wrap = document.getElementById('notif-toast-wrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'notif-toast';
  el.innerHTML = `
    <div class="notif-ic ${item.cls}">${item.ic}</div>
    <div class="ntxt"><div class="t">${escapeHtml(item.title)}</div><div class="d">${escapeHtml(item.sub)}</div></div>
    <div class="nclose" title="Fermer">✕</div>
    <div class="nprog"></div>
  `;
  wrap.prepend(el);
  requestAnimationFrame(()=>el.classList.add('show'));

  const prog = el.querySelector('.nprog');
  let remaining = NOTIF_TOAST_DURATION;
  let startedAt = Date.now();
  let dismissTimer = null;

  function playProgress(ms){
    prog.style.transition = 'none';
    void prog.offsetWidth; // force le navigateur à figer l'état courant avant l'animation
    prog.style.transition = `width ${ms}ms linear`;
    prog.style.width = '0%';
  }
  function play(){
    startedAt = Date.now();
    playProgress(remaining);
    dismissTimer = setTimeout(()=>dismissNotifToast(el), remaining);
  }
  function pause(){
    clearTimeout(dismissTimer);
    remaining = Math.max(300, remaining - (Date.now() - startedAt));
    const w = getComputedStyle(prog).width;
    prog.style.transition = 'none';
    prog.style.width = w;
  }

  el.addEventListener('mouseenter', pause);
  el.addEventListener('mouseleave', play);
  el.querySelector('.nclose').addEventListener('click', e=>{
    e.stopPropagation();
    clearTimeout(dismissTimer);
    dismissNotifToast(el);
  });
  el.addEventListener('click', ()=>{
    clearTimeout(dismissTimer);
    dismissNotifToast(el);
    closeTopbarPanels();
    if(item.action) item.action();
  });

  prog.style.width = '100%';
  play();
}
function dismissNotifToast(el){
  if(!el || el.classList.contains('hide')) return;
  el.classList.remove('show');
  el.classList.add('hide');
  setTimeout(()=>el.remove(), 300);
}
function clearAllNotifToasts(){
  const wrap = document.getElementById('notif-toast-wrap');
  if(wrap) wrap.innerHTML = '';
}

/* ---- generic live search: matches if the row text contains the typed letters (in order, not necessarily contiguous) ---- */
function fuzzyMatch(text, query){
  text = (text||'').toString().toLowerCase();
  query = (query||'').toString().toLowerCase().trim();
  if(!query) return true;
  return text.includes(query);
}

function donut(segments, total){
  total = total ?? 0;
  if(!segments.length){
    return `
      <div class="donut-wrap">
        <div class="donut" style="background:conic-gradient(var(--border) 0% 100%);">
          <div style="width:88px;height:88px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;">
            <div style="font-weight:800;font-size:16px;">0</div>
            <div style="font-size:10px;color:var(--text-faint);">articles</div>
          </div>
        </div>
        <div class="legend"><div class="item" style="color:var(--text-faint)">Aucun article</div></div>
      </div>
    `;
  }
  let acc = 0;
  const stops = segments.map(s=>{
    const start = acc; acc += s.pct;
    return `${s.color} ${start}% ${acc}%`;
  }).join(', ');
  return `
    <div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${stops});">
        <div style="width:88px;height:88px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;">
          <div style="font-weight:800;font-size:16px;">${total}</div>
          <div style="font-size:10px;color:var(--text-faint);">articles</div>
        </div>
      </div>
      <div class="legend">
        ${segments.map(s=>`<div class="item"><span class="k"><span class="dot" style="background:${s.color}"></span>${s.label}</span><b>${s.pct}%</b></div>`).join('')}
      </div>
    </div>
  `;
}

        </div>
      </div>
    </div>
  `;
  await loadArticles();
  fillDemandeDraft();
}
function fillDemandeDraft(){
  document.getElementById('nd-tbody').innerHTML = demandeDraft.map((a,i)=>{
    // Un article peut être choisi sur cette ligne s'il n'est pas déjà utilisé par une AUTRE ligne
    // (on garde l'article actuel de la ligne dans la liste même s'il est "utilisé" par elle-même).
    const usedElsewhere = demandeDraft.filter((d,j)=>j!==i).map(d=>d.id);
    const options = articles.filter(art=>!usedElsewhere.includes(art.id));
    const selectHtml = `<select style="min-width:180px" onchange="changeDemandeArticleRow(${i}, this.value)">
      ${options.map(art=>`<option value="${art.id}" ${art.id===a.id?'selected':''}>${escapeHtml(art.nom)}</option>`).join('')}
    </select>`;
    return `
    <tr>
      <td style="font-weight:600">${selectHtml}</td>
      <td>${a.dispo}</td>
      <td><input type="number" style="width:80px;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px" value="${a.qte}" min="1" max="${a.dispo}" onchange="demandeDraft[${i}].qte=+this.value"></td>
      <td><div class="act-icons"><button class="danger" onclick="removeDemandeArticleRow(${i})">🗑</button></div></td>
    </tr>`;
  }).join('') || `<tr><td colspan="4" class="empty">Aucun article ajouté</td></tr>`;
}
function changeDemandeArticleRow(i, newArticleId){
  const art = articles.find(a=>a.id === +newArticleId);
  if(!art) return;
  demandeDraft[i] = {id: art.id, art: art.nom, dispo: art.stock, qte: Math.min(demandeDraft[i].qte || 1, art.stock || 1) || 1};
  fillDemandeDraft();
}
function addDemandeArticleRow(){
  const used = demandeDraft.map(d=>d.art);
  const avail = articles.filter(a=>!used.includes(a.nom));
  if(!avail.length){ toast(articles.length ? 'Tous les articles sont déjà ajoutés' : "Aucun article n'existe encore"); return; }
  const pick = avail[0];
  demandeDraft.push({id: pick.id, art: pick.nom, dispo: pick.stock, qte: 1});
  fillDemandeDraft();
}
function removeDemandeArticleRow(i){
  demandeDraft.splice(i,1);
  fillDemandeDraft();
}
async function submitDemande(){
  if(!demandeDraft.length){ toast('Ajoutez au moins un article'); return; }
  const totalQte = demandeDraft.reduce((s,a)=>s+(+a.qte||0),0);
  const payload = {
    service: document.getElementById('nd-service').value,
    demandeur: state.userName,
    date: document.getElementById('nd-date').value,
    articles: demandeDraft.length,
    qte: totalQte,
    lignes: demandeDraft.map(a=>({article_id: a.id, qte: +a.qte||0})),
  };
  let data;
  try{ data = await apiCall('demandes_add.php', payload); }
  catch(e){ toast('Impossible de contacter le serveur (vérifiez XAMPP)'); return; }
  if(!data.success){ toast(data.message || "Erreur lors de l'envoi"); return; }
  toast(data.partielle
    ? `Demande envoyée : ${data.num_validee} livrée immédiatement, ${data.num_attente} en attente pour le reste du stock`
    : 'Demande envoyée avec succès');
  state.route = 'my-demandes';
  render();
}

          <div class="detail-box"><div class="lbl">Montant total</div><div class="val">${fmt(cm.montant)} DT</div></div>
        </div>
        <h3 style="font-size:14px;margin:6px 0 10px;">Articles</h3>
        <table>
          <thead><tr><th>Article</th><th>Quantité</th><th>Prix unitaire (DT)</th><th>Sous-total</th></tr></thead>
          <tbody>
            ${cm.items.map(it=>`<tr><td style="font-weight:600">${it.art}</td><td>${it.qte}</td><td>${fmt(it.pu)}</td><td>${fmt(it.qte*it.pu)}</td></tr>`).join('')}
            <tr><td colspan="3" style="text-align:right;font-weight:700">Total</td><td style="font-weight:800">${fmt(cm.montant)} DT</td></tr>
          </tbody>
        </table>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;">
          <button class="btn btn-ghost" onclick="openEditCommandeModal('${cm.num}')">Modifier</button>
          ${cm.statut==='attente' ? `<button class="btn btn-blue" onclick="receiveCommande('${cm.num}')">Recevoir la commande</button>` : ''}
        </div>
      </div>
    </div>
  `;
}
async function receiveCommande(num){
  let data;
  try{ data = await apiCall('commandes_receive.php', {num}); }
  catch(e){ toast('Impossible de contacter le serveur (vérifiez XAMPP)'); return; }
  if(!data.success){ toast(data.message || 'Erreur lors de la réception'); return; }
  await Promise.all([loadCommandes(), loadArticles()]);
  toast(`${num} marquée comme reçue — stock mis à jour`);
  render();
}

/* ========================= ALERTS ========================= */
let alertesHistorique = [];
async function renderAlerts(c){
  state.alertsTab = state.alertsTab || 'actuelles';
  c.innerHTML = `<div class="card"><div class="card-body"><span class="empty">Chargement...</span></div></div>`;
  await loadArticles();
  try{
    const data = await apiGet('alertes_historique_list.php');
    alertesHistorique = data.success ? data.alertes : [];
  }catch(e){ alertesHistorique = []; }
  fillAlertsPage(c);
}
function fillAlertsPage(c){
  const tabs = [['actuelles','Alertes actuelles'],['historique','Historique']];
  c.innerHTML = `
    <div class="page-head">
      <div class="tabs">${tabs.map(([k,l])=>`<div class="tab ${state.alertsTab===k?'active':''}" onclick="setAlertsTab('${k}')">${l}</div>`).join('')}</div>
      <div class="search-box"><span class="sic">🔍</span><input placeholder="Rechercher..." oninput="filterAlerts(this.value)"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>${state.alertsTab==='actuelles' ? 'Alertes de stock' : "Historique des alertes"}</h3></div>
      <div class="card-body" style="padding:0">
        ${state.alertsTab==='actuelles' ? `
        <table>
          <thead><tr><th>Article</th><th>Catégorie</th><th>Stock actuel</th><th>Stock minimum</th><th>Stock maximum</th><th>Emplacement</th><th>Niveau</th><th>Actions</th></tr></thead>
          <tbody id="al-tbody"><tr><td colspan="8" class="empty">Chargement...</td></tr></tbody>
        </table>` : `
        <table>
          <thead><tr><th>Date</th><th>Article</th><th>Catégorie</th><th>Stock</th><th>Seuil min</th><th>Niveau</th><th>Motif</th></tr></thead>
          <tbody id="al-hist-tbody"><tr><td colspan="7" class="empty">Chargement...</td></tr></tbody>
        </table>`}
      </div>
    </div>
  `;
  if(state.alertsTab==='actuelles') fillAlerts(computeAlerts());
  else fillAlertesHistorique(alertesHistorique);
}
function setAlertsTab(t){ state.alertsTab=t; fillAlertsPage(document.getElementById('content')); }
function fillAlertesHistorique(list){
  const tbody = document.getElementById('al-hist-tbody');
  if(!tbody) return;
  tbody.innerHTML = list.map(a=>`
    <tr>
      <td class="mono">${escapeHtml(a.date_alerte)}</td>
      <td style="font-weight:600">${escapeHtml(a.article_nom)}</td>
      <td>${escapeHtml(a.cat)}</td>
      <td>${a.stock}</td>
      <td>${a.min_seuil}</td>
      <td>${niveauBadge(a.niveau==='critique'?'Critique':'Bas')}</td>
      <td>${escapeHtml(a.motif||'—')}</td>
    </tr>`).join('') || `<tr><td colspan="7" class="empty">Aucune alerte enregistrée pour le moment</td></tr>`;
}
function computeAlerts(){
  return articles.filter(a=>a.stock<=a.min).map(a=>({
    art:a.nom, cat:a.cat, stock:a.stock, min:a.min, max:a.max, emp:a.emp,
    niveau: a.stock<=0 ? 'Critique' : 'Bas',
  })).sort((x,y)=> (x.niveau===y.niveau ? 0 : (x.niveau==='Critique'?-1:1)));
}
function fillAlerts(list){
  document.getElementById('al-tbody').innerHTML = list.map(a=>`
    <tr>
      <td style="font-weight:600">${escapeHtml(a.art)}</td>
      <td>${escapeHtml(a.cat)}</td>
      <td>${a.stock}</td><td>${a.min}</td><td>${a.max}</td>
      <td class="mono">${escapeHtml(a.emp || '—')}</td>
      <td>${niveauBadge(a.niveau)}</td>
      <td><div class="act-icons"><button class="view" onclick="openAlertDetail('${a.art.replace(/'/g,"\\'")}')">👁</button></div></td>
    </tr>`).join('') || `<tr><td colspan="8" class="empty">Aucune alerte — tous les stocks sont au-dessus du minimum</td></tr>`;
}
function filterAlerts(q){
  if(state.alertsTab==='historique'){
    fillAlertesHistorique(alertesHistorique.filter(a=>fuzzyMatch(a.article_nom,q)||fuzzyMatch(a.motif||'',q)));
  } else {
    fillAlerts(computeAlerts().filter(a=>fuzzyMatch(a.art,q)));
  }
}
function openAlertDetail(art){
  const a = computeAlerts().find(x=>x.art===art);
  if(!a) return;
  openModal(a.art, `
    <div class="detail-line"><span class="k">Catégorie</span><span class="v">${escapeHtml(a.cat)}</span></div>
    <div class="detail-line"><span class="k">Emplacement</span><span class="v">${escapeHtml(a.emp || '—')}</span></div>
    <div class="detail-line"><span class="k">Stock actuel</span><span class="v">${a.stock}</span></div>
    <div class="detail-line"><span class="k">Stock minimum</span><span class="v">${a.min}</span></div>
    <div class="detail-line"><span class="k">Stock maximum</span><span class="v">${a.max}</span></div>
    <div class="detail-line"><span class="k">Niveau</span><span class="v">${niveauBadge(a.niveau)}</span></div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
    <button class="btn btn-blue" onclick="closeModal();state.route='stock-entries';render()">Commander</button>
  `);
}

/* ========================= HISTORY ========================= */
async function renderHistory(c){
  c.innerHTML = `
    <div class="page-head">
      <div class="search-box"><span class="sic">🔍</span><input placeholder="Rechercher..." oninput="filterHistory(this.value)"></div>
      <button class="btn btn-ghost" onclick="cycleHistoryFilter()" id="hist-filter-btn">⏷ Filtrer : ${histFilterLabel()}</button>
      <button class="btn btn-blue" onclick="openExportHistoriqueModal()">⬇ Télécharger</button>
    </div>
    <div class="card"><div class="card-body" style="padding:0">
      <table>
        <thead><tr><th>N°</th><th>Article</th><th>Type</th><th>Quantité</th><th>Date</th><th>Utilisateur</th><th>Service</th></tr></thead>
        <tbody id="hist-tbody"><tr><td colspan="7" class="empty">Chargement...</td></tr></tbody>
      </table>
    </div></div>
  `;
  await loadHistorique();
  fillHistory(historique);
}
function histFilterLabel(){
  return {toutes:'Toutes', entree:'Entrées', sortie:'Sorties'}[state.historyFilter];
}
function cycleHistoryFilter(){
  const order = ['toutes','entree','sortie'];
  state.historyFilter = order[(order.indexOf(state.historyFilter)+1)%order.length];
  applyHistoryFilters();
}
let historiqueView = [];
function fillHistory(list){
  historiqueView = list;
  document.getElementById('hist-tbody').innerHTML = list.map(h=>`
    <tr>
      <td class="mono">${h.ref_num || '-'}</td>
      <td style="font-weight:600">${h.art}</td>
      <td>${h.type==='sortie'?'<span class="badge red">Sortie</span>':'<span class="badge green">Entrée</span>'}</td>
      <td class="${moveClass(h)}">${moveSign(h)}${h.qte}</td>
      <td class="mono">${h.date}</td>
      <td>${h.user}</td>
      <td>${h.service || '-'}</td>
    </tr>`).join('') || `<tr><td colspan="7" class="empty">Aucun mouvement trouvé</td></tr>`;
}
let historySearchQ = '';
function filterHistory(q){ historySearchQ = q; applyHistoryFilters(); }
function applyHistoryFilters(){
  let list = historique;
  if(state.historyFilter!=='toutes') list = list.filter(h=>h.type===state.historyFilter);
  list = list.filter(h=>fuzzyMatch(h.art,historySearchQ)||fuzzyMatch(h.user,historySearchQ)||fuzzyMatch(h.motif,historySearchQ));
  fillHistory(list);
  const btn = document.getElementById('hist-filter-btn');
  if(btn) btn.textContent = `⏷ Filtrer : ${histFilterLabel()}`;
}

/* ========================= EXPORT HISTORIQUE (PDF / Word / Excel) ========================= */
const HIST_HEADERS = ['N°','Article','Type','Quantité','Date','Utilisateur','Service'];
function histExportRows(){
  return historiqueView.map(h=>[
    h.ref_num || '-', h.art, h.type==='sortie' ? 'Sortie' : 'Entrée',
    moveSign(h)+h.qte, h.date, h.user, h.service || '-'
  ]);
}
function histExportStamp(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
function openExportHistoriqueModal(){
  const n = historiqueView.length;
  openModal("Télécharger l'historique", `
    <p style="font-size:13px;color:var(--text-2,#667);margin:0 0 14px;">Exporter le tableau affiché (${n} mouvement${n>1?'s':''}) dans le format de ton choix.</p>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn btn-ghost" style="justify-content:flex-start" onclick="exportHistoriqueFormat('pdf')">📄 &nbsp;PDF (.pdf)</button>
      <button class="btn btn-ghost" style="justify-content:flex-start" onclick="exportHistoriqueFormat('word')">📝 &nbsp;Word (.doc)</button>
      <button class="btn btn-ghost" style="justify-content:flex-start" onclick="exportHistoriqueFormat('excel')">📊 &nbsp;Excel (.xlsx)</button>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button>`);
}
async function exportHistoriqueFormat(fmt){
  closeModal();
  if(!historiqueView.length){ toast('Aucun mouvement à exporter'); return; }
  try{
    if(fmt==='pdf') await exportHistoriquePDF();
    else if(fmt==='word') exportHistoriqueWord();
    else if(fmt==='excel') await exportHistoriqueExcel();
  }catch(e){ toast("Erreur lors de l'export : " + (e.message || e)); }
}
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Impossible de charger ' + src + ' (vérifie ta connexion internet)'));
    document.head.appendChild(s);
  });
}
async function exportHistoriqueExcel(){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const rows = [HIST_HEADERS, ...histExportRows()];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:22},{wch:10},{wch:10},{wch:18},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Historique');
  XLSX.writeFile(wb, `historique_${histExportStamp()}.xlsx`);
  toast('Export Excel téléchargé');
}
async function exportHistoriquePDF(){
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  doc.setFontSize(14);
  doc.text('Historique des mouvements — StockPilot', 14, 15);
  doc.autoTable({ head: [HIST_HEADERS], body: histExportRows(), startY: 20, styles: { fontSize: 9 } });
  doc.save(`historique_${histExportStamp()}.pdf`);
  toast('Export PDF téléchargé');
}
function exportHistoriqueWord(){
  const headHtml = HIST_HEADERS.map(h=>`<th style="border:1px solid #ccc;padding:5px 9px;background:#eee;">${h}</th>`).join('');
  const rowsHtml = histExportRows().map(r=>`<tr>${r.map(c=>`<td style="border:1px solid #ccc;padding:5px 9px;">${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('');
  const html = `<html><head><meta charset="utf-8"></head><body>
    <h2 style="font-family:Arial;">Historique des mouvements — StockPilot</h2>
    <table style="border-collapse:collapse;font-family:Arial;font-size:12px;">
      <thead><tr>${headHtml}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
  </body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historique_${histExportStamp()}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Export Word téléchargé');
}
